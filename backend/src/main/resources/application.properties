spring.application.name=receitas-api

# Banco: em desenvolvimento vem do compose.yaml (spring-boot-docker-compose).
# Em produção, defina SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
spring.docker.compose.lifecycle-management=start-only

# O esquema é criado pelo Flyway (db/migration); o Hibernate só confere se as entidades batem.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.error.include-message=always

# Token de acesso (JWT). Em produção, defina JWT_SECRET com pelo menos 32 caracteres.
app.jwt.secret=${JWT_SECRET:troque-este-segredo-de-desenvolvimento-cookie-2026}
app.jwt.validade=7d

# Front-end autorizado a chamar a API.
app.cors.origens=http://localhost:3000,http://localhost:5173

# Pasta onde as fotos enviadas são salvas.
app.uploads.pasta=${UPLOADS_DIR:uploads}

# Cria as contas e receitas de demonstração quando o banco está vazio.
app.demo.ativo=true

# E-mails de notificação (a recuperação de senha usa código e não depende de SMTP).
app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:noreply@cookie.local}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Assistente de receitas (Groq API; a chave fica somente no backend).
app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:25}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_READ_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:5000}
